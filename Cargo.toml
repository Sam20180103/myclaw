[workspace]
resolver = "2"
members = [
"crates/gateway",
"crates/channel",
"crates/agent",
"crates/tool",
"crates/provider",
"crates/protocol",
"crates/config",
"crates/storage",
"crates/cli",
"crates/skill",
"crates/memory",
"crates/compression",
"crates/feishu",
"crates/wechat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustClaw Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web server
axum = "0.7"
tokio-tungstenite = "0.21"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"

# Process
tokio-process = "0.3"

# Directories
dirs = "5.0"

# Testing
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json", "stream"] }

# RSS/Atom parsing
feed-rs = "1.4"

# Base64 encoding/decoding
base64 = "0.21"

# Rate limiting
governor = "0.6"

# SQLite storage
rusqlite = { version = "0.32", features = ["bundled", "fts5"] }

[package]
name = "rustclaw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rustclaw-gateway = { path = "crates/gateway" }
rustclaw-agent = { path = "crates/agent" }
rustclaw-skill = { path = "crates/skill" }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
