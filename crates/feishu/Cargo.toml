[package]
name = "rustclaw-feishu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rustclaw-protocol = { path = "../protocol" }
rustclaw-agent = { path = "../agent" }
rustclaw-channel = { path = "../channel" }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
governor = "0.6"
rustclaw-memory = { path = "../memory" }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tungstenite = "0.24"
prost = "0.13"
base64 = "0.22"

# OpenLark - 飞书非官方 SDK
open_lark = { package = "open-lark", git = "https://github.com/foxzool/openlark", tag = "v0.14.0", features = ["websocket", "im"] }
lark-websocket-protobuf = "0.1"
